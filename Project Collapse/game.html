<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampire Survivor Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            overflow: hidden;
        }

        .player {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #00ff00;
            border-radius: 50%;
            border: 2px solid #00aa00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 100;
        }

        .enemy {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ff0000;
            border-radius: 50%;
            border: 2px solid #aa0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            z-index: 50;
        }

        .projectile {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffff00;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 255, 0, 0.8);
            z-index: 30;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
        }

        .ui-item {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            color: white;
            text-align: center;
        }

        #gameOver h1 {
            font-size: 60px;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        #gameOver p {
            font-size: 24px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 20px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #gameOver button:hover {
            background: #00aa00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }

        .wave-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
            pointer-events: none;
        }

        .wave-indicator.show {
            animation: waveAnimation 2s ease-in-out;
        }

        @keyframes waveAnimation {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
        }

        #shopButton {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #ffaa00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 200;
            transition: all 0.3s;
        }

        #shopButton:hover {
            background: #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.8);
        }

        #shopModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffaa00;
            border-radius: 15px;
            padding: 30px;
            z-index: 250;
            display: none;
            flex-direction: column;
            color: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        #shopModal h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
        }

        .shop-money {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffff00;
            padding: 10px;
            background: rgba(255, 255, 0, 0.1);
            border-radius: 8px;
        }

        .upgrade-item {
            background: rgba(255, 170, 0, 0.1);
            border: 2px solid #ffaa00;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-info {
            flex: 1;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 16px;
            color: #ffaa00;
        }

        .upgrade-desc {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        .upgrade-cost {
            color: #ffff00;
            font-weight: bold;
            margin-right: 10px;
            min-width: 60px;
        }

        .upgrade-btn {
            padding: 8px 15px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: #00aa00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .upgrade-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .shop-close {
            align-self: flex-end;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .shop-close:hover {
            background: #aa0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        #shopOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 240;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui">
            <div class="ui-item">
                <span>Score:</span>
                <span id="score">0</span>
            </div>
            <div class="ui-item">
                <span>Health:</span>
                <span id="health">100</span>
            </div>
            <div class="ui-item">
                <span>Time:</span>
                <span id="time">0:00</span>
            </div>
            <div class="ui-item">
                <span>Wave:</span>
                <span id="wave">1</span>
            </div>
            <div class="ui-item">
                <span>Enemies:</span>
                <span id="enemyCount">0</span>
            </div>
        </div>
        <div class="wave-indicator" id="waveIndicator"></div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Survival Time: <span id="survivalTime">0:00</span></p>
            <p>Wave Reached: <span id="waveReached">1</span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Game variables
        const gameContainer = document.getElementById('gameContainer');
        const gameOverScreen = document.getElementById('gameOver');
        const scoreDisplay = document.getElementById('score');
        const healthDisplay = document.getElementById('health');
        const timeDisplay = document.getElementById('time');
        const waveDisplay = document.getElementById('wave');
        const enemyCountDisplay = document.getElementById('enemyCount');
        const waveIndicator = document.getElementById('waveIndicator');

        // Game state
        let gameRunning = true;
        let score = 0;
        let health = 100;
        let wave = 1;
        let startTime = Date.now();
        let playerProjectiles = [];
        let enemies = [];
        let nextWaveTime = 1; // 1 second

        // Player object
        const player = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            width: 30,
            height: 30,
            speed: 5,
            element: null,
            moveUp: false,
            moveDown: false,
            moveLeft: false,
            moveRight: false
        };

        // Create player element
        function createPlayerElement() {
            player.element = document.createElement('div');
            player.element.className = 'player';
            gameContainer.appendChild(player.element);
            updatePlayerPosition();
        }

        // Update player position
        function updatePlayerPosition() {
            player.element.style.left = (player.x - player.width / 2) + 'px';
            player.element.style.top = (player.y - player.height / 2) + 'px';
        }

        // Handle player movement
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') player.moveUp = true;
            if (e.key === 'ArrowDown' || e.key === 's') player.moveDown = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') player.moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') player.moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') player.moveUp = false;
            if (e.key === 'ArrowDown' || e.key === 's') player.moveDown = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') player.moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') player.moveRight = false;
        });

        // Update player movement
        function updatePlayer() {
            if (player.moveUp && player.y > 30) player.y -= player.speed;
            if (player.moveDown && player.y < window.innerHeight - 30) player.y += player.speed;
            if (player.moveLeft && player.x > 30) player.x -= player.speed;
            if (player.moveRight && player.x < window.innerWidth - 30) player.x += player.speed;

            updatePlayerPosition();
        }

        // Spawn enemy
        function spawnEnemy() {
            const side = Math.floor(Math.random() * 0);
            let x, y;

            if (side === 0) { // top
                x = Math.random() * window.innerWidth;
                y = -20;
            } else if (side === 1) { // bottom
                x = Math.random() * window.innerWidth;
                y = window.innerHeight + 20;
            } else if (side === 2) { // left
                x = -20;
                y = Math.random() * window.innerHeight;
            } else { // right
                x = window.innerWidth + 20;
                y = Math.random() * window.innerHeight;
            }

            const enemy = {
                x: x,
                y: y,
                width: 25,
                height: 25,
                speed: 1.5 + (wave * 0.1),
                element: null,
                health: 1
            };

            const enemyElement = document.createElement('div');
            enemyElement.className = 'enemy';
            gameContainer.appendChild(enemyElement);
            enemy.element = enemyElement;

            enemies.push(enemy);
            updateEnemyCount();
        }

        // Update enemies
        function updateEnemies() {
            enemies.forEach((enemy, index) => {
                // Move towards player
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0) {
                    enemy.x += (dx / distance) * enemy.speed;
                    enemy.y += (dy / distance) * enemy.speed;
                }

                // Update position
                enemy.element.style.left = (enemy.x - enemy.width / 2) + 'px';
                enemy.element.style.top = (enemy.y - enemy.height / 2) + 'px';

                // Check collision with player
                const dist = Math.sqrt(Math.pow(player.x - enemy.x, 2) + Math.pow(player.y - enemy.y, 2));
                if (dist < player.width / 2 + enemy.width / 2) {
                    health -= 0.5;
                    if (health <= 0) {
                        endGame();
                    }
                }
            });
        }

        // Fire projectiles automatically
        function fireProjectiles() {
            if (enemies.length > 0 && Math.random() < 0.05) {
                const targetEnemy = enemies[Math.floor(Math.random() * enemies.length)];
                
                const projectile = {
                    x: player.x,
                    y: player.y,
                    width: 8,
                    height: 8,
                    speed: 5,
                    element: null,
                    targetEnemy: targetEnemy
                };

                const projectileElement = document.createElement('div');
                projectileElement.className = 'projectile';
                gameContainer.appendChild(projectileElement);
                projectile.element = projectileElement;

                playerProjectiles.push(projectile);
            }
        }

        // Update projectiles
        function updateProjectiles() {
            playerProjectiles.forEach((projectile, projIndex) => {
                if (projectile.targetEnemy && enemies.includes(projectile.targetEnemy)) {
                    const dx = projectile.targetEnemy.x - projectile.x;
                    const dy = projectile.targetEnemy.y - projectile.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > 0) {
                        projectile.x += (dx / distance) * projectile.speed;
                        projectile.y += (dy / distance) * projectile.speed;
                    }

                    // Check collision with target
                    const collisionDist = Math.sqrt(Math.pow(projectile.x - projectile.targetEnemy.x, 2) + 
                                                   Math.pow(projectile.y - projectile.targetEnemy.y, 2));
                    if (collisionDist < projectile.width / 2 + projectile.targetEnemy.width / 2) {
                        projectile.targetEnemy.health -= 1;
                        projectile.element.remove();
                        playerProjectiles.splice(projIndex, 1);

                        if (projectile.targetEnemy.health <= 0) {
                            const enemyIndex = enemies.indexOf(projectile.targetEnemy);
                            if (enemyIndex > -1) {
                                projectile.targetEnemy.element.remove();
                                enemies.splice(enemyIndex, 1);
                                score += 100;
                                updateEnemyCount();
                            }
                        }
                    }
                } else {
                    projectile.element.remove();
                    playerProjectiles.splice(projIndex, 1);
                }

                // Remove off-screen projectiles
                if (projectile.x < -20 || projectile.x > window.innerWidth + 20 ||
                    projectile.y < -20 || projectile.y > window.innerHeight + 20) {
                    if (projectile.element.parentNode) {
                        projectile.element.remove();
                    }
                    playerProjectiles.splice(projIndex, 1);
                }
            });

            // Update projectile positions
            playerProjectiles.forEach(projectile => {
                projectile.element.style.left = (projectile.x - projectile.width / 2) + 'px';
                projectile.element.style.top = (projectile.y - projectile.height / 2) + 'px';
            });
        }

        // Update UI
        function updateUI() {
            scoreDisplay.textContent = score;
            healthDisplay.textContent = Math.max(0, Math.floor(health));
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            waveDisplay.textContent = wave;
        }

        // Update enemy count
        function updateEnemyCount() {
            enemyCountDisplay.textContent = enemies.length;
        }

        // Wave system
        function checkWave() {
            if (Date.now() % 10000 < 100) { // Every ~10 seconds
                for (let i = 0; i < 2 + wave; i++) {
                    spawnEnemy();
                }
                wave++;
                showWaveIndicator();
            }
        }

        // Show wave indicator
        function showWaveIndicator() {
            waveIndicator.textContent = `WAVE ${wave}!`;
            waveIndicator.classList.remove('show');
            setTimeout(() => {
                waveIndicator.classList.add('show');
            }, 10);
        }

        // End game
        function endGame() {
            gameRunning = false;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            document.getElementById('finalScore').textContent = score;
            document.getElementById('survivalTime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('waveReached').textContent = wave;

            gameOverScreen.style.display = 'flex';
        }

        // Initialize game
        function init() {
            createPlayerElement();
            
            // Spawn initial enemies
            for (let i = 0; i < 3; i++) {
                spawnEnemy();
            }

            gameLoop();
        }

        // Main game loop
        let waveSpawnTimer = 0;
        function gameLoop() {
            if (!gameRunning) return;

            updatePlayer();
            updateEnemies();
            fireProjectiles();
            updateProjectiles();
            updateUI();

            // Wave spawning
            waveSpawnTimer++;
            if (waveSpawnTimer > 600) { // Every 10 seconds
                for (let i = 0; i < 2 + wave; i++) {
                    spawnEnemy();
                }
                wave++;
                showWaveIndicator();
                waveSpawnTimer = 0;
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the game
        init();
    </script>
</body>
</html>
