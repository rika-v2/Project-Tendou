the <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Haste - Emblem of Insanity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .dropdown-content { display: none; }
        .dropdown-content.show { display: block; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div id="navbar-container" class="w-full"></div>
    <script src="../navbar-init.js"></script>
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-6 border-b border-red-900/50 bg-red-950/10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-red-500">Emblem of Insanity</h1>
                <p class="text-slate-400 text-sm mt-1">Generate Level 3 Potential sets across all slots.</p>
            </div>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Main Menu
            </a>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Trekker Selection -->
                <div class="relative">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Trekker (CharID)</label>
                    <input type="text" id="trekkerSearch" placeholder="Search Trekker..." 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500 transition-all">
                    <div id="trekkerDropdown" class="dropdown-content absolute z-50 w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-60 overflow-y-auto custom-scrollbar"></div>
                    <input type="hidden" id="charId" value="">
                </div>

                <!-- UID Input -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Target UID</label>
                    <input type="text" id="uid" placeholder="e.g. 12345" 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-red-500 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="generateBtn" class="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-red-900/20 active:scale-[0.98]">
                    Generate All Pots (Lv3)
                </button>
                <button id="saveSettingsBtn" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all border border-slate-700">
                    Save Settings
                </button>
            </div>

            <!-- Output Section -->
            <div class="mt-8">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span class="text-xs font-bold text-red-400 uppercase tracking-widest">Bulk Command List</span>
                    <button id="copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 transition-all">
                        Copy All Commands
                    </button>
                </div>
                <div class="relative">
                    <pre id="commandOutput" class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-sm text-slate-300 overflow-y-auto max-h-80 custom-scrollbar leading-relaxed">
Select a Trekker and UID to begin...
                    </pre>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="insanity.js"></script>
</body>
</html>
