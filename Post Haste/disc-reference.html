<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Haste - Disc Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 bg-slate-950">
    <div id="navbar-container" class="w-full"></div>
    <script src="../navbar-init.js"></script>
    <div class="max-w-6xl mx-auto">
        <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-4xl font-black text-white tracking-tight mb-2">Disc <span class="text-amber-500">Reference</span></h1>
                <p class="text-slate-400 font-medium">Database of Discs including IDs and elemental alignments.</p>
            </div>
            <a href="index.html" class="inline-flex items-center justify-center px-6 py-3 bg-slate-900 border border-slate-800 text-white rounded-xl hover:bg-slate-800 transition-all font-bold gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Menu
            </a>
        </header>

        <div id="discContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Injected via Script -->
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        function renderDiscList() {
            const discContent = document.getElementById('discContent');
            let html = '';

            if (!discDB || discDB.length === 0) {
                html = `<div class="col-span-full text-center p-12 bg-slate-900 rounded-3xl border border-slate-800 text-slate-500">No discs configured in data.js yet.</div>`;
            } else {
                discDB.forEach(disc => {
                    const colorClass = elementColors[disc.element] || 'text-slate-400';
                    html += `
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl hover:border-amber-500/30 transition-all group flex flex-col justify-between h-full">
                            <div>
                                <div class="text-[11px] text-slate-500 font-mono font-bold uppercase tracking-wider mb-2 group-hover:text-amber-500 transition-colors flex justify-between">
                                    <span>ID: ${disc.id}</span>
                                    <span class="${colorClass}">${disc.element}</span>
                                </div>
                                <h2 class="text-lg font-bold text-white leading-tight">${disc.name}</h2>
                            </div>
                        </div>`;
                });
            }
            discContent.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', renderDiscList);
    </script>
</body>
</html>
