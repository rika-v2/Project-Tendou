<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Haste - Emblem Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .dropdown-content { display: none; }
        .dropdown-content.show { display: block; }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-4 md:p-8 flex items-center justify-center">
    <div id="navbar-container" class="w-full fixed top-0 left-0 right-0 z-50"></div>
    <script src="../navbar-init.js"></script>
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden mt-20">
        <div class="p-4 sm:p-6 border-b border-slate-800 bg-slate-900/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-2">
            <div>
                <h1 class="text-lg sm:text-2xl font-bold text-blue-400">Emblem Builder</h1>
                <p class="text-slate-400 text-xs sm:text-sm mt-1">Supports only Aqua Trekkers for now.</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="ph-main.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Main Menu
                </a>
            </div>
        </div>

        <div class="p-4 sm:p-6 space-y-4 sm:space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6">
                <!-- Trekker Selection -->
                <div class="relative">
                    <label class="block text-xs sm:text-sm font-medium text-slate-300 mb-2">Trekker (CharID)</label>
                    <input type="text" id="trekkerSearch" placeholder="Search Trekker..." 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 sm:px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <div id="trekkerDropdown" class="dropdown-content absolute z-50 w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl max-h-60 overflow-y-auto custom-scrollbar">
                        <!-- Options generated by JS -->
                    </div>
                    <input type="hidden" id="charId" value="">
                </div>

                <!-- Slot Selection -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-slate-300 mb-2">Slot (1-3)</label>
                    <select id="slot" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 sm:px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        <option value="1">Slot 1</option>
                        <option value="2">Slot 2</option>
                        <option value="3">Slot 3</option>
                    </select>
                </div>

                <!-- UID Input -->
                <div>
                    <label class="block text-xs sm:text-sm font-medium text-slate-300 mb-2">User ID (UID)</label>
                    <input type="text" id="uid" placeholder="e.g. 12345" 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 sm:px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                <!-- Substat Selection Slots -->
                <div class="space-y-4" id="substatContainer">
                    <!-- Content injected via main.js -->
                </div>

                <div class="space-y-4" id="substatContainer2">
                    <!-- Content injected via main.js -->
                </div>
            </div>

            <!-- Output Section -->
            <div class="mt-6 sm:mt-8 p-3 sm:p-4 bg-slate-950 rounded-xl border border-blue-500/30">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 sm:gap-0 mb-2">
                    <span class="text-xs font-bold text-blue-400 uppercase tracking-widest">Generated Command</span>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="saveBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded transition-colors font-medium border border-slate-700 flex-1 sm:flex-none">
                            Save Configuration
                        </button>
                        <button id="copyBtn" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded transition-colors font-medium flex-1 sm:flex-none">
                            Copy to Clipboard
                        </button>
                    </div>
                </div>
                <div id="commandOutput" class="text-xs sm:text-sm md:text-lg font-mono text-white break-all overflow-x-auto">
                    !emblem [CharID] [Slot] 0 0 0 0 @[UID]
                </div>
            </div>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
