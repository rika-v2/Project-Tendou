<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archived Manga Reader</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-zinc-100 overflow-hidden">

  <!-- TOP BAR -->
  <header class="fixed top-0 left-0 right-0 z-50
                 flex items-center justify-between
                 px-4 py-3
                 bg-zinc-900/80 backdrop-blur border-b border-zinc-800">

    <div class="flex items-center gap-3">
      <button
        id="openLibraryBtn"
        class="px-4 py-2 rounded-lg
               bg-zinc-800 hover:bg-zinc-700
               transition"
      >
        Open Library
      </button>

      <button
        id="backBtn"
        class="hidden px-4 py-2 rounded-lg
               bg-zinc-800 hover:bg-zinc-700
               transition"
      >
        Back
      </button>
    </div>

    <div class="text-sm text-zinc-400">
      Archived Manga Reader
    </div>
  </header>

  <!-- MAIN -->
  <main class="pt-20 h-screen">

    <!-- LIBRARY -->
    <section
      id="libraryView"
      class="p-6 overflow-y-auto h-full"
    >
      <h1 class="text-3xl font-bold mb-6">
        Library
      </h1>

      <div
        id="libraryGrid"
        class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5"
      ></div>
    </section>

    <!-- CHAPTERS -->
    <section
      id="chaptersView"
      class="hidden p-6 overflow-y-auto h-full"
    >
      <h1
        id="mangaTitle"
        class="text-3xl font-bold mb-6"
      ></h1>

      <div
        id="chaptersList"
        class="flex flex-col gap-3"
      ></div>
    </section>

    <!-- READER -->
    <section
      id="readerView"
      class="hidden overflow-y-auto h-full bg-black"
    >
      <div
        id="readerContainer"
        class="flex flex-col items-center gap-1 py-6"
      ></div>
    </section>

  </main>
  <script src="./manifest.js"></script>
  <script src="./archived.js"></script>
</body>
</html>
