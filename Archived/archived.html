<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archived Manga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .manga-card {
      position: relative;
      overflow: hidden;
      border-radius: 0.5rem;
    }
    .manga-card img {
      transition: transform 0.3s ease;
    }
    .manga-card:hover img {
      transform: scale(1.05);
    }
    .manga-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      padding: 1rem;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .manga-card:hover .manga-card-overlay {
      opacity: 1;
      transform: translateY(0);
    }
    #readerContainer img {
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100">
  <!-- Load Navbar -->
  <div id="navbar-container"></div>
  <script src="../navbar-init.js"></script>

  <!-- MAIN CONTENT -->
  <main class="relative z-10 max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-6 sm:py-12">

    <!-- LIBRARY VIEW -->
    <section id="libraryView">
      <div class="mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold mb-2">Archived Manga</h1>
        <p class="text-sm sm:text-base text-slate-400">Browse and read archived manga collections</p>
      </div>

      <div id="libraryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 md:gap-6"></div>
    </section>

    <!-- CHAPTERS VIEW -->
    <section id="chaptersView" class="hidden">
      <div class="mb-6 sm:mb-8 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
        <button id="backBtn" class="px-3 sm:px-4 py-2.5 sm:py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition font-medium text-sm sm:text-base whitespace-nowrap h-10 sm:h-auto">
          ← Back
        </button>
        <div class="min-w-0">
          <h1 id="mangaTitle" class="text-2xl sm:text-3xl md:text-4xl font-bold truncate"></h1>
          <p id="mangaDescription" class="text-xs sm:text-sm text-slate-400 mt-1 sm:mt-2"></p>
        </div>
      </div>

      <div class="bg-slate-900/50 rounded-xl p-4 sm:p-6 border border-slate-800/50">
        <h2 class="text-lg sm:text-xl font-bold mb-4 sm:mb-6">Chapters</h2>
        <div id="chaptersList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3"></div>
      </div>
    </section>

    <!-- READER VIEW -->
    <section id="readerView" class="hidden">
      <div class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur-sm border-b border-slate-800/50 mb-6 py-3 px-3 sm:py-4 sm:px-4 -mx-3 sm:-mx-4 md:-mx-6 lg:-mx-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
          <button id="backFromReaderBtn" class="px-3 py-2 sm:px-4 sm:py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition font-medium text-sm sm:text-base h-10 sm:h-auto whitespace-nowrap">
            ← Back
          </button>
          <h2 id="readerTitle" class="text-lg sm:text-2xl font-bold flex-1 text-center truncate"></h2>
          <div id="pageIndicator" class="text-xs sm:text-sm text-slate-400 whitespace-nowrap font-mono">1/1</div>
        </div>
      </div>

      <!-- Book-style Reader -->
      <div class="max-w-5xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 pb-12">
        <div class="flex flex-col sm:flex-row gap-4 sm:gap-6">
          <!-- Left Page -->
          <div class="flex-1 flex flex-col items-center">
            <div id="leftPageContainer" class="relative w-full bg-slate-900 rounded-lg border border-slate-700 overflow-hidden shadow-2xl" style="aspect-ratio: 3/4;">
              <img id="leftPageImg" src="" alt="Left page" class="w-full h-full object-contain" />
              <div id="leftPageLoading" class="absolute inset-0 flex items-center justify-center bg-slate-800/50">
                <div class="text-slate-400 text-sm">Loading...</div>
              </div>
            </div>
          </div>

          <!-- Right Page (visible on larger screens) -->
          <div class="hidden sm:flex flex-1 flex-col items-center">
            <div id="rightPageContainer" class="relative w-full bg-slate-900 rounded-lg border border-slate-700 overflow-hidden shadow-2xl" style="aspect-ratio: 3/4;">
              <img id="rightPageImg" src="" alt="Right page" class="w-full h-full object-contain" />
              <div id="rightPageLoading" class="absolute inset-0 flex items-center justify-center bg-slate-800/50">
                <div class="text-slate-400 text-sm">Loading...</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Navigation Controls -->
        <div class="mt-6 sm:mt-8 flex items-center justify-between gap-2 sm:gap-4">
          <button id="prevBtn" class="px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg bg-slate-800 hover:bg-slate-700 transition font-medium text-sm sm:text-base h-10 sm:h-auto">← Previous</button>
          
          <div id="pageSlider" class="flex-1 flex items-center gap-2 sm:gap-4">
            <input type="range" id="pageInput" min="1" max="1" value="1" class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500" />
            <span id="pageDisplay" class="text-xs sm:text-sm text-slate-400 font-mono whitespace-nowrap">Page 1</span>
          </div>
          
          <button id="nextBtn" class="px-4 sm:px-6 py-2.5 sm:py-3 rounded-lg bg-slate-800 hover:bg-slate-700 transition font-medium text-sm sm:text-base h-10 sm:h-auto">Next →</button>
        </div>

        <!-- Reading Mode Toggle -->
        <div class="mt-4 flex gap-2 justify-center">
          <button id="modeToggle" class="px-4 py-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition font-medium text-xs sm:text-sm text-slate-300">📖 Book Mode</button>
        </div>
      </div>
    </section>

  </main>

  <script src="./manifest.js"></script>
  <script src="./archived.js"></script>
</body>
</html>
