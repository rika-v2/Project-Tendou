<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate ID Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.16), transparent 25%),
                        linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-100">
    <div id="navbar-container"></div>
    <script src="navbar-init.js"></script>

    <main class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 pt-8">
        <section class="rounded-[32px] border border-slate-700/70 bg-slate-950/90 p-8 shadow-2xl shadow-slate-950/40 backdrop-blur-xl">
            <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-sky-400/80">Utility</p>
                    <h1 class="text-4xl font-semibold text-white">Duplicate ID Checker</h1>
                    <p class="mt-3 max-w-2xl text-slate-400">Upload a text list to identify duplicate Discord IDs and extract the first matching username for each entry.</p>
                </div>
                <button id="resetButton" class="inline-flex items-center justify-center rounded-3xl bg-slate-800 px-5 py-3 text-sm font-semibold text-slate-200 transition hover:bg-slate-700">Reset</button>
            </div>

            <div class="grid gap-4 md:grid-cols-[1fr_auto]">
                <label class="block w-full">
                    <span class="text-sm font-medium text-slate-300">Select a file</span>
                    <input id="fileInput" type="file" accept=".txt" class="mt-2 w-full rounded-3xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-slate-100 outline-none transition focus:border-sky-400 focus:ring-2 focus:ring-sky-400/20" />
                </label>
                <button id="checkButton" class="rounded-3xl bg-sky-500 px-6 py-3 text-white font-semibold transition hover:bg-sky-400">Check Duplicates</button>
            </div>

            <div id="status" class="mt-6 rounded-3xl border border-slate-700/70 bg-slate-900/80 px-5 py-4 text-slate-300">
                Upload a file to begin.
            </div>
        </section>

        <section id="resultsSection" class="mt-8 hidden rounded-[32px] border border-slate-700/70 bg-slate-950/90 p-6 shadow-2xl shadow-slate-950/40 backdrop-blur-xl">
            <div class="space-y-6" id="results"></div>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const checkButton = document.getElementById('checkButton');
        const resetButton = document.getElementById('resetButton');
        const resultsSection = document.getElementById('resultsSection');
        const resultsDiv = document.getElementById('results');
        const status = document.getElementById('status');

        checkButton.addEventListener('click', processFile);
        resetButton.addEventListener('click', resetChecker);

        function processFile() {
            if (fileInput.files.length === 0) {
                status.textContent = 'Please select a text file first.';
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const text = e.target.result;
                checkDuplicates(text);
            };

            reader.readAsText(file);
            status.textContent = `Processing ${file.name}...`;
        }

        function resetChecker() {
            fileInput.value = '';
            resultsDiv.innerHTML = '';
            resultsSection.classList.add('hidden');
            status.textContent = 'Upload a file to begin.';
        }

        function checkDuplicates(text) {
            const rawLines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const idData = {};

            rawLines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                const id = parts.find(p => /^\d+$/.test(p));
                if (!id) return;
                const username = parts.find(p => !/^\d+$/.test(p)) || '(no username)';

                if (!idData[id]) {
                    idData[id] = { count: 0, usernames: [] };
                }
                idData[id].count++;
                if (!idData[id].usernames.includes(username)) {
                    idData[id].usernames.push(username);
                }
            });

            const duplicateIDs = Object.entries(idData).filter(([_, data]) => data.count > 1);
            const uniqueList = Object.entries(idData).map(([id, data]) => ({ id, username: data.usernames[0] }));

            displayResults(rawLines.length, duplicateIDs, uniqueList, rawLines);
        }

        function displayResults(originalCount, duplicateIDs, uniqueList, rawLines) {
            resultsDiv.innerHTML = '';
            resultsSection.classList.remove('hidden');

            const summary = document.createElement('div');
            summary.className = 'grid gap-4 md:grid-cols-3';
            summary.innerHTML = `
                <div class="rounded-3xl bg-slate-900/80 p-5">
                    <p class="text-sm text-slate-400">Total lines</p>
                    <p class="mt-3 text-3xl font-semibold text-white">${originalCount}</p>
                </div>
                <div class="rounded-3xl bg-slate-900/80 p-5">
                    <p class="text-sm text-slate-400">Duplicate IDs</p>
                    <p class="mt-3 text-3xl font-semibold text-white">${duplicateIDs.length}</p>
                </div>
                <div class="rounded-3xl bg-slate-900/80 p-5">
                    <p class="text-sm text-slate-400">Unique IDs</p>
                    <p class="mt-3 text-3xl font-semibold text-white">${uniqueList.length}</p>
                </div>
            `;
            resultsDiv.appendChild(summary);

            const duplicatePanel = document.createElement('div');
            duplicatePanel.className = 'mt-6 rounded-3xl border border-rose-500/20 bg-rose-500/5 p-5';
            duplicatePanel.innerHTML = `<h2 class="text-xl font-semibold text-white">Duplicate IDs</h2>`;

            if (duplicateIDs.length > 0) {
                const list = document.createElement('div');
                list.className = 'mt-4 grid gap-3';
                duplicateIDs.forEach(([id, data]) => {
                    const card = document.createElement('div');
                    card.className = 'rounded-3xl bg-slate-950/90 p-4 border border-slate-700/70';
                    card.innerHTML = `
                        <p class="font-semibold text-white">ID: ${id}</p>
                        <p class="mt-2 text-slate-300">Appears ${data.count} times</p>
                        <p class="mt-2 text-slate-400">Usernames: ${data.usernames.join(', ')}</p>
                    `;
                    list.appendChild(card);
                });
                duplicatePanel.appendChild(list);
            } else {
                duplicatePanel.innerHTML += `<p class="mt-4 text-slate-400">No duplicate IDs found.</p>`;
            }

            const uniquePanel = document.createElement('div');
            uniquePanel.className = 'mt-6 rounded-3xl border border-slate-700/70 bg-slate-950/90 p-5';
            uniquePanel.innerHTML = `<h2 class="text-xl font-semibold text-white">Unique ID List</h2>`;

            const uniqueListContainer = document.createElement('div');
            uniqueListContainer.className = 'mt-4 grid gap-2';
            uniqueList.slice(0, 50).forEach(entry => {
                const item = document.createElement('div');
                item.className = 'rounded-2xl bg-slate-900/80 px-4 py-3 text-slate-200';
                item.textContent = `${entry.id} — ${entry.username}`;
                uniqueListContainer.appendChild(item);
            });
            if (uniqueList.length > 50) {
                const more = document.createElement('p');
                more.className = 'mt-3 text-sm text-slate-500';
                more.textContent = `Showing 50 of ${uniqueList.length} unique IDs.`;
                uniquePanel.appendChild(more);
            }
            uniquePanel.appendChild(uniqueListContainer);

            resultsDiv.appendChild(duplicatePanel);
            resultsDiv.appendChild(uniquePanel);
            status.textContent = `Processed ${originalCount} lines with ${duplicateIDs.length} duplicate IDs found.`;
        }
    </script>
</body>
</html>
