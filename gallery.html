<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Mobile background handling */
        @media (max-width: 768px) {
            .video-bg-desktop { display: none; }
            .bg-mobile-fallback { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        }
        @media (min-width: 769px) {
            .bg-mobile-fallback { display: none; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <!-- Load Navbar -->
    <div id="navbar-container"></div>
    <script src="navbar-init.js"></script>

    <!-- Subtle background - video for desktop, gradient for mobile -->
    <div class="fixed inset-0 -z-10 opacity-40 video-bg-desktop">
        <video autoplay muted loop playsinline class="w-full h-full object-cover" 
    onloadedmetadata="this.play()">
            <source src="images/mari1.mp4" type="video/mp4">
        </video>
    </div>
    <div class="fixed inset-0 -z-10 bg-mobile-fallback"></div>

    <main class="relative z-10 max-w-6xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-6 sm:py-8 md:py-12">
        <header class="mb-6 sm:mb-8 text-center">
            <h1 class="text-xl sm:text-2xl md:text-4xl font-extrabold text-white">Gallery</h1>
            <p class="text-xs sm:text-sm md:text-base text-slate-400 mt-2">A curated selection of images and clips.</p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 md:gap-6">
            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <img src="" alt="thumb" class="w-full h-56 object-cover" onerror="this.style.display='none'">
                <div class="p-4 text-slate-300">None</div>
            </div>
            
             <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <img src="" alt="thumb" class="w-full h-56 object-cover" onerror="this.style.display='none'">
                <div class="p-4 text-slate-300">None</div>
            </div>

             <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <img src="" alt="thumb" class="w-full h-56 object-cover" onerror="this.style.display='none'">
                <div class="p-4 text-slate-300">None</div>
            </div>

            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <video controls class="w-full h-40 sm:h-48 md:h-56 object-cover bg-black">
                    <source src="images/Noaholic/Miyako (1).mp4" type="video/mp4">
                </video>
                <div class="p-2 sm:p-3 md:p-4 text-xs sm:text-sm text-slate-300">Miyako (1)</div>
            </div>

            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <video controls class="w-full h-40 sm:h-48 md:h-56 object-cover bg-black">
                    <source src="images/Noaholic/Miyako (2).mp4" type="video/mp4">
                </video>
                <div class="p-2 sm:p-3 md:p-4 text-xs sm:text-sm text-slate-300">Miyako (2)</div>
            </div>

            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800">
                <video controls class="w-full h-40 sm:h-48 md:h-56 object-cover bg-black">
                    <source src="images/Noaholic/Miyako (3).mp4" type="video/mp4">
                </video>
                <div class="p-2 sm:p-3 md:p-4 text-xs sm:text-sm text-slate-300">Miyako (3)</div>
            </div>

            <div class="col-span-1 sm:col-span-2 md:col-span-3 bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center p-4 sm:p-6 md:p-8 text-xs sm:text-sm text-slate-500">
                No more media found. Add images to the `images/` folder.
            </div>
        </div>
    </main>
</body>
</html>
